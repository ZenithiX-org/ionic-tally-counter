<ion-header [translucent]="true" class="apple-header">
  <ion-toolbar>
    <ion-title>Tally</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tally</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="page">
    <div class="caption">Count</div>
    <div class="value" [class.pop]="pop">{{ count }}</div>

    <div class="controls">
      <ion-button
        class="circle secondary"
        fill="clear"
        (click)="decrement()"
        aria-label="Decrease">
        −
      </ion-button>
      <ion-button
        class="circle primary"
        (click)="increment()"
        aria-label="Increase">
        +
      </ion-button>
    </div>

    @if (count !== 0) {
      <button type="button" class="reset" (click)="reset()">Reset</button>
    }
  </div>
</ion-content>
